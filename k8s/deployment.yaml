apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastify-api-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastify-api
  template:
    metadata:
      labels:
        app: fastify-api
    spec:
      containers:
        - name: fastify-api
          image: kubernetes-integration-test:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: fastify-api-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: fastify-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30080